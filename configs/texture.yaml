# Эксперимент: классификация текстур FastViT-T8 на патчах 224x224.
#
# Изображения train/val/test режутся на патчи по сетке. К train-патчам
# применяются аугментации (повороты, гауссов блюр, гауссов шум). Метрики
# (accuracy / precision / recall / f1) считаются на патчах (основная
# метрика) и на целых изображениях (агрегация предсказаний патчей).

seed: 42
# auto | cpu | cuda
device: auto

dataset:
  root: data/dataset2_exp_prepared
  # На диске сплит сделан по файлам, и кадры одного образца
  # (``15_11_17(2-1)пп(20)-1-3`` и ``-2-4``) попадают в разные сплиты.
  # regroup: true пересобирает train/val/test в памяти по группам кадров,
  # regroup: false берёт папки train/val/test как есть.
  regroup: false
  group_by: sample
  split_seed: 42
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  grayscale: true
  # Ограничение числа изображений на класс в каждом сплите (для smoke-тестов).
  max_images_per_class: null

patches:
  size: 224
  # Перекрытие соседних патчей сетки, 0 <= overlap < 1.
  train_overlap: 0.0
  eval_overlap: 0.0
  # Добавлять патчи, прижатые к правому/нижнему краю, чтобы покрыть всё
  # изображение, даже если размер не кратен шагу сетки.
  include_edges: true
  # Сколько случайных патчей сетки брать с каждого train-изображения за
  # эпоху. null = все патчи каждую эпоху.
  train_patches_per_image: null
  # Режим дополнения при выходе патча за границы изображения: reflect | replicate.
  pad_mode: reflect
  # Нормализация патча (в градациях серого один канал).
  normalize:
    mean: [0.5]
    std: [0.5]
  # LRU-кэш декодированных изображений (шт.) в каждом воркере DataLoader.
  cache_size: 512

augmentation:
  enabled: true
  rotation:
    prob: 1.0
    # Случайный поворот на кратный 90 градусам угол (без потери пикселей).
    rot90: true
    # Дополнительный поворот на произвольный угол в [-degrees, degrees].
    # Чтобы не было чёрных углов, из изображения вырезается патч
    # с запасом (size * sqrt(2)), поворачивается и обрезается до size.
    # 0 отключает произвольный поворот.
    degrees: 15.0
  hflip_prob: 0.5
  vflip_prob: 0.5
  gaussian_blur:
    prob: 0.3
    kernel_size: 5
    sigma: [0.1, 2.0]
  gaussian_noise:
    prob: 0.3
    # Стандартное отклонение шума в единицах яркости [0, 1].
    std: 0.03

model:
  # fastvit_* и другие имена timm, texture_cnn / tcnn, twistnet18, либо hipervit.
  # T-CNN: depth 1..5 (по умолчанию 3), pretrained: false, dropout 0.5, fc_dim 4096.
  # TwistNet-18: pretrained: false; num_heads 4, c_red 8, stem_type resnet.
  # HiPerViT: backbone (по умолчанию vit_small_patch14_dinov2.lvd142m),
  # stages — номера блоков ViT с 1 (по умолчанию [1, 5]), sketch_dim 512,
  # num_latents 64, topology interact_distill | distill_interact | late_fusion.
  # global_size и local_size: null = размер патча. В статье глобальный вид 448
  # и локальный кроп 224. dropout и drop_path_rate у T-CNN и TwistNet не
  # используются; у HiPerViT они задают dropout только в блоках fusion.
  # Голова HiPerViT (SRM, Perceiver, классификатор) учится с train.lr,
  # ViT — с train.backbone_lr, если он задан.
  name: fastvit_t8
  pretrained: true
  dropout: 0.2
  drop_path_rate: 0.1
  # Обучать только классификационную голову.
  freeze_backbone: false

train:
  epochs: 40
  batch_size: 32
  lr: 1.0e-4
  # LR для backbone (голова использует lr). null = единый lr.
  backbone_lr: null
  weight_decay: 0.05
  # Линейный разогрев, далее косинусное затухание до min_lr (по шагам).
  warmup_epochs: 2
  min_lr: 1.0e-6
  label_smoothing: 0.1
  # Взвешивать классы в loss обратно пропорционально числу изображений.
  class_weights: false
  max_grad_norm: 1.0
  num_workers: 4
  # Mixed precision (только на CUDA).
  amp: true

evaluation:
  batch_size: 64
  num_workers: 4
  # Агрегация предсказаний патчей в предсказание изображения:
  # mean_prob | majority_vote
  aggregation: mean_prob
  # Усреднение precision/recall/f1: macro | weighted | micro
  metrics_average: macro
  # Метрика выбора лучшего чекпоинта и ранней остановки:
  # val_patch_f1 | val_patch_accuracy | val_image_f1 | val_image_accuracy | val_loss
  selection_metric: val_patch_f1
  early_stopping_patience: 10
  min_delta: 0.0
  # Оценка на train в eval-режиме (без аугментаций), патчи + изображения.
  # Каждые N эпох; 0 отключает. В metrics.csv это колонки train_eval_*,
  # тогда как train_loss / train_running_* - метрики обучающего прохода
  # по аугментированным патчам.
  eval_train_every: 1
  # Сколько патчей на train-изображение брать для этой оценки
  # (фиксированное подмножество, одно и то же на всех эпохах). null = все.
  train_eval_patches_per_image: 16
  # Считать ли на лучшем чекпоинте метрики на train (без аугментаций).
  eval_train_at_end: true

logging:
  save_dir: logs
  run_name: fastvit_t8_patches_all_patches_overlap_0.5
  # Добавлять к имени запуска метку времени.
  timestamp_dir: true
  log_file: experiment.log
  # Метрики по эпохам (train/train_eval/val, патчи и изображения).
  metrics_csv: metrics.csv
  # Итоговые метрики лучшего чекпоинта на train/val/test (патчи и изображения).
  final_csv: final_metrics.csv
  log_every_n_batches: 20
  save_last: true
