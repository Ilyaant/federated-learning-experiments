seed: 42

dataset:
  root: data/dataset2_exp_prepared
  patch_size: 224
  overlap: 0.5
  grayscale: true
  normalize: true
  cache_size: 64
  augmentation:
    enabled: true
    hflip_prob: 0.5
    vflip_prob: 0.5
    rotation_degrees: 45.0
    blur_prob: 0.2
    blur_kernel_size: 5
    noise_prob: 0.2
    noise_std: 0.05

model:
  num_classes: 5
  pretrained: true
  freeze_backbone: false
  dropout: 0.0
  drop_path_rate: 0.1

train:
  lr: 0.0001
  min_lr: 0.000001
  weight_decay: 0.01
  max_grad_norm: 1.0
  batch_size: 32
  local_epochs: 3
  num_workers: 4
  epoch_fraction: 0.3
  balanced_per_image: true
  with_replacement: false
  aggregation: average_probability

federated:
  num_clients: 10
  rounds: 100
  partition: stratified

server:
  address: 127.0.0.1:8080

logging:
  save_dir: logs
  log_file: experiment.log

simulation:
  num_workers: 0
  client_resources:
    num_cpus: 2
    num_gpus: 0.5
