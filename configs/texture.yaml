seed: 42

dataset:
  root: data/dataset2_exp_prepared
  # Re-split train/val/test by capture group so frames of the same
  # sample never leak across splits. split_seed is independent of
  # the training seed so hyperparameter sweeps stay comparable.
  regroup: true
  group_by: sample
  split_seed: 42
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  patch_size: 224
  overlap: 0.5
  # Shrink the whole image by this factor before cutting patches:
  # 1.0 = native scale (300 patches/image), 3.0 => a 224 patch spans
  # ~30% of the image width (~15 patches/image, much more context).
  downscale: 1.0
  grayscale: true
  normalize: true
  cache_size: 256
  augmentation:
    enabled: true
    hflip_prob: 0.5
    vflip_prob: 0.5
    rot90_prob: 0.75
    rotation_degrees: 0.0
    blur_prob: 0.2
    blur_kernel_size: 5
    noise_prob: 0.2
    noise_std: 0.05

model:
  num_classes: 5
  pretrained: true
  freeze_backbone: false
  dropout: 0.3
  drop_path_rate: 0.2

train:
  lr: 0.0001
  min_lr: 0.00001
  weight_decay: 0.05
  # If set, backbone uses this LR and the head uses `lr`. Cosine scales both.
  # backbone_lr: 0.00001
  max_grad_norm: 1.0
  batch_size: 32
  epochs: 100
  num_workers: 4
  epoch_fraction: 1.0
  balanced_per_image: true
  with_replacement: false
  aggregation: average_probability
  label_smoothing: 0.1
  weighted_loss: true
  class_weight_power: 0.5

evaluation:
  # Select checkpoints by patch-level val F1 (the task metric).
  selection_metric: val_f1
  early_stopping_patience: 15
  min_delta: 0.0
  # Held-out test is scored once at the end on the best/SWA weights.
  eval_test: end
  eval_val_every: 1
  tta: true
  eval_train: false
  eval_train_every: 1
  # Average the N best val checkpoints rather than the last (overfit) ones.
  swa_window: 5
  swa_mode: best
  swa_eval_every: 0

logging:
  save_dir: logs/runs
  run_name: texture
  unique_dir: true
  log_file: experiment.log
