seed: 42

dataset:
  root: data/dataset2_exp_prepared
  patch_size: 224
  overlap: 0.5
  grayscale: true
  normalize: true
  cache_size: 64

model:
  num_classes: 5
  pretrained: true
  freeze_backbone: false
  dropout: 0.0
  drop_path_rate: 0.1

train:
  lr: 0.0001
  weight_decay: 0.01
  batch_size: 32
  local_epochs: 3
  num_workers: 4
  epoch_fraction: 1.0
  balanced_per_image: true
  with_replacement: false
  aggregation: average_probability

federated:
  num_clients: 10
  rounds: 100
  partition: stratified

server:
  address: 127.0.0.1:8080

logging:
  save_dir: logs

simulation:
  num_workers: 0
  client_resources:
    num_cpus: 7
    num_gpus: 0.0
