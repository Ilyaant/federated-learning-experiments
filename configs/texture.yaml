seed: 42

dataset:
  root: data/dataset2_exp_prepared
  patch_size: 224
  overlap: 0.5
  # Shrink the whole image by this factor before cutting patches:
  # 1.0 = native scale (300 patches/image), 3.0 => a 224 patch spans
  # ~30% of the image width (~15 patches/image, much more context).
  downscale: 1.0
  grayscale: true
  normalize: true
  cache_size: 256
  augmentation:
    enabled: true
    hflip_prob: 0.5
    vflip_prob: 0.5
    rot90_prob: 0.75
    rotation_degrees: 0.0
    blur_prob: 0.2
    blur_kernel_size: 5
    noise_prob: 0.2
    noise_std: 0.05

model:
  num_classes: 5
  pretrained: true
  freeze_backbone: false
  dropout: 0.3
  drop_path_rate: 0.2

train:
  lr: 0.0001
  min_lr: 0.00001
  weight_decay: 0.05
  max_grad_norm: 1.0
  batch_size: 32
  epochs: 100
  num_workers: 4
  # With downscale=3 there are only ~30 patches/image, so the per-epoch
  # subsampling that fought redundancy at native scale is not needed.
  epoch_fraction: 1.0
  balanced_per_image: true
  with_replacement: false
  aggregation: average_probability
  label_smoothing: 0.1
  weighted_loss: true
  class_weight_power: 0.5

evaluation:
  # Average predictions over the 8 dihedral (flip/rot90) views of each
  # patch for val/test metrics. Costs 8x eval compute on those splits.
  tta: true
  # Evaluate the train split (without TTA) after every epoch.
  eval_train: true
  # Weight averaging over the last N epochs. 0 disables. The averaged
  # model is evaluated on val/test (metrics prefixed swa_*) and saved
  # as model_swa.pt.
  swa_window: 10
  # Evaluate the SWA model every N epochs (always on the last one).
  swa_eval_every: 1

logging:
  save_dir: logs/centralized
  log_file: experiment.log
