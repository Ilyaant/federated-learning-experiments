seed: 42
dataset:
  root: data/dataset2_exp_prepared
  regroup: true
  group_by: sample
  split_seed: 42
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  patch_size: 224
  overlap: 0.5
  downscale: 1.0
  grayscale: true
  normalize: true
  cache_size: 256
  augmentation:
    enabled: true
    hflip_prob: 0.5
    vflip_prob: 0.5
    rot90_prob: 0.75
    rotation_degrees: 0.0
    blur_prob: 0.0
    blur_kernel_size: 5
    noise_prob: 0.0
    noise_std: 0.05
model:
  num_classes: 5
  pretrained: true
  freeze_backbone: false
  dropout: 0.3
  drop_path_rate: 0.2
train:
  lr: 0.0001
  min_lr: 1.0e-05
  weight_decay: 0.05
  max_grad_norm: 1.0
  batch_size: 32
  epochs: 60
  num_workers: 4
  epoch_fraction: 1.0
  balanced_per_image: true
  with_replacement: false
  aggregation: average_probability
  label_smoothing: 0.1
  weighted_loss: true
  class_weight_power: 0.5
evaluation:
  selection_metric: val_f1
  early_stopping_patience: 20
  min_delta: 0.0
  eval_test: end
  eval_val_every: 1
  tta: false
  eval_train: false
  eval_train_every: 1
  swa_window: 0
  swa_mode: best
  swa_eval_every: 0
logging:
  save_dir: logs/sweeps2/ds1_regularize_20260912_220421/geom_ref
  run_name: geom_ref
  unique_dir: false
  log_file: experiment.log
